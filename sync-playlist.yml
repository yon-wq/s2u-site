name: Sync playlist from Notion

on:
  schedule:
    # every Wednesday & Saturday at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 3,6'
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-playlist.js

      - name: Commit changes if any
        run: |
          git config user.name "playlist-sync-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Auto-sync playlist from Notion tracker"
            git push
          fi
